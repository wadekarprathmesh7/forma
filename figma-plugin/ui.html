<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-header: #212121;
    --text-invert: #fafafa;
    --text-primary: #424242;
    --border-alpha: rgba(0, 0, 0, 0.1);
    --text-alpha-tertiary: rgba(0, 0, 0, 0.3);
    --pill-bg: rgba(0, 0, 0, 0.1);
    --toggle-active-bg: #424242;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; overflow: hidden; }
  body { font-family: "Roboto Mono", monospace; color: var(--text-primary); font-size: 14px; }

  .panel { display: flex; flex-direction: column; height: 100vh; width: 100%; }

  /* ---------- Header ---------- */
  .pheader {
    background: var(--bg-header);
    height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 18px;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  /* assets/logo.svg has preserveAspectRatio="none" plus width/height="100%"
     baked into the file (from its original design export), which breaks
     `width: auto` intrinsic-ratio sizing on <img> in some renderers. Set an
     explicit width matching the real 184.8:48 aspect ratio instead. Loaded
     as inline SVG (not <img src>) so the wordmark's var(--fill-0, #424242)
     paths can be recoloured white for the dark header, an <img> can't
     inherit CSS custom properties from the host document. */
  .logo-wrap { height: 24px; width: 92.414px; flex-shrink: 0; display: block; }
  .logo-wrap svg { display: block; height: 100%; width: 100%; }
  .brand span {
    font-family: "Inter", sans-serif;
    font-size: 14px;
    color: var(--text-invert);
    white-space: nowrap;
  }
  .header-credit {
    display: flex; flex-direction: column; gap: 4px; width: 98px; flex-shrink: 0;
    text-align: right; font-family: "Inter", sans-serif;
  }
  .header-credit-label { margin: 0; font-size: 8px; font-weight: 400; color: rgba(255, 255, 255, 0.5); }
  .header-credit-name { margin: 0; font-size: 10px; font-weight: 500; color: var(--text-invert); }

  /* ---------- Search + category row ---------- */
  .row1 {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; flex-shrink: 0; gap: 12px;
  }
  .search-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .search-wrap img { width: 24px; height: 24px; flex-shrink: 0; opacity: 0.55; }
  .search-wrap input {
    border: none; outline: none; background: transparent; font-family: "Roboto Mono", monospace;
    font-size: 14px; color: var(--text-primary); width: 100%; min-width: 0;
  }
  .search-wrap input::placeholder { color: var(--text-alpha-tertiary); }

  .category-btn {
    background: var(--pill-bg); border: none; border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; padding: 4px 8px; flex-shrink: 0;
    font-family: "Roboto Mono", monospace; font-weight: 500; font-size: 12px; color: var(--text-primary);
    position: relative;
  }
  .category-btn img { width: 16px; height: 16px; }

  /* ---------- Dividers ---------- */
  .hdiv { height: 1px; width: 100%; background: var(--border-alpha); flex-shrink: 0; }
  /* No fixed height: row2 uses align-items: stretch, so this always
     matches its siblings' actual height instead of a stale hardcoded
     value falling short (or overshooting) when they resize. */
  .vdiv { width: 1px; background: var(--border-alpha); flex-shrink: 0; }

  /* ---------- Toolbar row 2: weight | format | colour ---------- */
  .row2 { display: flex; align-items: stretch; flex-shrink: 0; }

  .weight-section { flex: 1; min-width: 0; padding: 15px 8px; display: flex; align-items: center; }
  /* Icon-only segmented buttons (no label -- this toolbar row is too
     compact for one): each stop shows a real icon rendered in that
     weight, fixed 40x40px, evenly spread across the row. */
  .weight-slider-track { display: flex; justify-content: space-between; width: 100%; }
  .weight-option {
    width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    padding: 8px 0; border-radius: 8px; border: none; background: transparent; cursor: pointer;
  }
  .weight-option.active { background: var(--background-secondary, #eee); }
  .weight-option-icon { width: 24px; height: 24px; flex-shrink: 0; }
  .weight-option-icon svg { width: 100%; height: 100%; display: block; }

  .format-section { padding: 15px 16px; display: flex; align-items: center; }
  .format-toggle { display: flex; border: 1px solid var(--toggle-active-bg); border-radius: 8px; overflow: hidden; }
  .format-opt {
    border: none; background: transparent; cursor: pointer; padding: 4px 8px;
    font-family: "Roboto Mono", monospace; font-weight: 500; font-size: 12px; color: var(--text-primary);
  }
  .format-opt.active { background: var(--toggle-active-bg); color: var(--text-invert); }

  .colour-section { padding: 15px 16px; display: flex; align-items: center; }
  /* Social icons are fixed brand colours; the whole colour control is
     disabled (dimmed + unclickable) while that category is active. */
  .colour-section.disabled { opacity: 0.35; pointer-events: none; }
  .colour-btn { display: flex; align-items: center; gap: 4px; border: none; background: transparent; cursor: pointer; padding: 0; position: relative; }
  .swatch-dot { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border-alpha); }
  .colour-btn img.chev { width: 16px; height: 16px; }

  .lock-badge {
    position: absolute; top: -4px; right: -4px; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 1px solid var(--border-alpha); display: flex; align-items: center; justify-content: center;
  }
  .lock-badge img { width: 9px; height: 9px; }

  /* ---------- Content ---------- */
  .content { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 24px; }
  .section-label { font-family: "Roboto Mono", monospace; font-weight: 500; font-size: 12px; color: var(--text-primary); margin: 0; }
  /* Icon grid scaled up 30% from the design's 40px tiles (40 -> 52px,
     padding/radius/gap scaled the same 1.3x to keep proportions). */
  /* Panel is 400px wide (figma.showUI), content has 16px padding each
     side -> 368px available. 5 tiles at 52px leaves 108px for 4 gaps,
     27px each; 26px leaves a hair of rounding margin so a 5th tile
     never accidentally wraps to a new row. */
  .icon-grid { display: flex; flex-wrap: wrap; gap: 26px; }
  .icon-tile {
    width: 52px; height: 52px; border-radius: 10.4px; border: none; background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 10.4px;
    position: relative;
  }
  .icon-tile:hover { background: var(--pill-bg); }
  .icon-tile svg { width: 100%; height: 100%; display: block; }
  .icon-tile .lock-badge { top: 2px; right: 2px; }
  .empty-state { color: var(--text-alpha-tertiary); font-size: 12px; padding: 24px 0; text-align: center; }

  /* ---------- Popovers / overlays ---------- */
  .popover {
    position: absolute; background: #fff; border: 1px solid var(--border-alpha); border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12); padding: 12px; z-index: 20; min-width: 200px;
  }
  .popover[hidden] { display: none; }
  .category-popover { top: 100%; right: 0; margin-top: 4px; max-height: 280px; overflow-y: auto; }
  .category-item {
    display: flex; align-items: center; justify-content: flex-start; gap: 8px; padding: 8px;
    border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  .category-item:hover { background: var(--pill-bg); }
  .category-item.active { font-weight: 700; }
  .category-item .cat-icon {
    width: 14px; height: 14px; flex-shrink: 0; display: flex;
    --fill-0: var(--text-primary); /* match the label's own colour */
  }
  .category-item .cat-icon svg { width: 100%; height: 100%; display: block; }

  .colour-popover { top: 100%; right: 0; margin-top: 4px; }
  .swatch-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .swatch {
    width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border-alpha); cursor: pointer; padding: 0;
  }
  .swatch.active { outline: 2px solid var(--text-primary); outline-offset: 2px; }
  .hex-input {
    width: 100%; border: 1px solid var(--border-alpha); border-radius: 6px; padding: 6px 8px;
    font-family: "Roboto Mono", monospace; font-size: 12px; color: var(--text-primary); outline: none;
  }

  .paywall-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center;
    justify-content: center; z-index: 100;
  }
  .paywall-overlay[hidden] { display: none; }
  .paywall {
    background: #fff; border-radius: 12px; padding: 24px; width: 300px; text-align: center;
    display: flex; flex-direction: column; gap: 12px;
  }
  .paywall h3 { margin: 0; font-family: "Inter", sans-serif; font-size: 16px; color: var(--text-primary); }
  .paywall p { margin: 0; font-size: 12px; color: var(--text-alpha-tertiary); line-height: 1.5; }
  .paywall-unlock, .paywall-cancel {
    border: none; border-radius: 8px; padding: 10px; font-family: "Roboto Mono", monospace;
    font-weight: 500; font-size: 12px; cursor: pointer;
  }
  .paywall-unlock {
    background: var(--toggle-active-bg); color: var(--text-invert); text-decoration: none;
    display: block; text-align: center;
  }
  .paywall-cancel { background: transparent; color: var(--text-primary); }
  .paywall-divider { font-size: 11px; color: var(--text-alpha-tertiary); text-align: center; }
  .paywall-license-row { display: flex; gap: 8px; }
  .paywall-license-row input {
    flex: 1; min-width: 0; border: 1px solid var(--border-alpha); border-radius: 8px; padding: 8px 10px;
    font-family: "Roboto Mono", monospace; font-size: 12px; color: var(--text-primary); outline: none;
  }
  .paywall-verify {
    border: 1px solid var(--toggle-active-bg); border-radius: 8px; padding: 0 12px; background: transparent;
    color: var(--text-primary); font-family: "Roboto Mono", monospace; font-weight: 500; font-size: 12px; cursor: pointer;
  }
  .paywall-error { margin: 0; font-size: 11px; color: #e53935; text-align: center; }
  .paywall-error[hidden] { display: none; }

  .toast {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--toggle-active-bg);
    color: var(--text-invert); padding: 8px 16px; border-radius: 8px; font-size: 12px; z-index: 200;
  }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
<div class="panel">
  <header class="pheader">
    <div class="brand">
      <span class="logo-wrap" id="logoWrap" aria-hidden="true"></span>
      <span>System Icon Set</span>
    </div>
    <div class="header-credit">
      <p class="header-credit-label">Designed &amp; developed by</p>
      <p class="header-credit-name">Prathmesh Wadekar</p>
    </div>
  </header>

  <div class="row1">
    <div class="search-wrap">
      <img id="searchImg" alt="" />
      <input id="searchInput" type="text" placeholder="Search icon" autocomplete="off" />
    </div>
    <div style="position: relative;">
      <button class="category-btn" id="categoryBtn" type="button">
        <span id="categoryLabel">General</span>
        <img id="chevronImg1" alt="" />
      </button>
      <div class="popover category-popover" id="categoryPopover" hidden></div>
    </div>
  </div>

  <div class="hdiv"></div>

  <div class="row2">
    <div class="weight-section">
      <div class="weight-slider-track" id="weightTrack"></div>
    </div>

    <div class="vdiv"></div>

    <div class="format-section">
      <div class="format-toggle" id="formatToggle">
        <button class="format-opt active" data-format="svg" type="button">SVG</button>
        <button class="format-opt" data-format="png" type="button">PNG</button>
      </div>
    </div>

    <div class="vdiv"></div>

    <div class="colour-section" id="colourSection">
      <div style="position: relative;">
        <button class="colour-btn" id="colourBtn" type="button">
          <span class="swatch-dot" id="swatchDot" style="background:#000000;"></span>
          <img class="chev" id="chevronImg2" alt="" />
        </button>
        <div class="popover colour-popover" id="colourPopover" hidden>
          <div class="swatch-row" id="swatchRow"></div>
          <input class="hex-input" id="hexInput" type="text" placeholder="#000000" maxlength="7" spellcheck="false" />
        </div>
      </div>
    </div>
  </div>

  <div class="hdiv"></div>

  <div class="content" id="content"></div>
</div>

<div class="paywall-overlay" id="paywallOverlay" hidden>
  <div class="paywall">
    <h3>Unlock full access</h3>
    <p>Browsing every category is free. Inserting icons from the General category is free forever, too. Unlock every other category with a one-time payment.</p>
    <a class="paywall-unlock" id="paywallBuyBtn" href="#" target="_blank" rel="noopener">Unlock (one-time payment)</a>
    <p class="paywall-divider">Already purchased?</p>
    <div class="paywall-license-row">
      <input id="licenseInput" type="text" placeholder="Enter your license key" spellcheck="false" autocomplete="off" />
      <button class="paywall-verify" id="verifyLicenseBtn" type="button">Verify</button>
    </div>
    <p class="paywall-error" id="paywallError" hidden></p>
    <button class="paywall-cancel" id="paywallCancelBtn" type="button">Not now</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  "use strict";

  const BASE_URL = "https://wadekarprathmesh7.github.io/forma/";
  // The only thing gated is inserting an icon from a category other than
  // this one onto the canvas (see insertIcon). Browsing every category/
  // weight/colour is unrestricted for everyone.
  const FREE_CATEGORY = "general";
  const ALL_CATEGORY = "all";
  const DEFAULT_WEIGHT_INDEX = 0; // Light
  const DEFAULT_COLOUR = "#000000";
  const PRESET_SWATCHES = ["#000000", "#FFFFFF", "#9E9E9E", "#2979FF", "#00C853", "#FFD600", "#FF3D00"];

  // Figma Payments (Stripe Connect) doesn't support payouts to India, so
  // unlocking runs through a Gumroad license key instead -- same model as
  // the web app, verified against the same server-side endpoint. Figma's
  // review guidelines explicitly allow directing users to a third party
  // for monetization, as long as it's disclosed (it is, in the listing).
  const GUMROAD_CHECKOUT_URL = "https://3745349451615.gumroad.com/l/kqytts";
  const LICENSE_API_URL = "https://forma-gamma-seven.vercel.app/api/verify-license";
  const LICENSE_STORAGE_KEY = "forma_unlocked";

  let unlockedThisSession = false; // fallback when localStorage is blocked

  function isUnlocked() {
    if (unlockedThisSession) return true;
    try {
      return localStorage.getItem(LICENSE_STORAGE_KEY) === "true";
    } catch {
      return false; // private/blocked storage
    }
  }

  function setUnlocked() {
    unlockedThisSession = true;
    try {
      localStorage.setItem(LICENSE_STORAGE_KEY, "true");
    } catch {
      /* ignore -- unlock still applies for the rest of this session */
    }
  }

  const state = {
    category: FREE_CATEGORY,
    weightIndex: DEFAULT_WEIGHT_INDEX,
    colour: DEFAULT_COLOUR,
    format: "svg",
    search: "",
    CATEGORIES: [],
    ICONS: {},
    WEIGHTS: [],
  };

  const svgCache = new Map(); // url -> raw svg text
  const asset = (path) => BASE_URL + path;

  const els = {
    logoWrap: document.getElementById("logoWrap"),
    searchImg: document.getElementById("searchImg"),
    searchInput: document.getElementById("searchInput"),
    categoryBtn: document.getElementById("categoryBtn"),
    categoryLabel: document.getElementById("categoryLabel"),
    categoryPopover: document.getElementById("categoryPopover"),
    chevronImg1: document.getElementById("chevronImg1"),
    chevronImg2: document.getElementById("chevronImg2"),
    weightTrack: document.getElementById("weightTrack"),
    formatToggle: document.getElementById("formatToggle"),
    colourSection: document.getElementById("colourSection"),
    colourBtn: document.getElementById("colourBtn"),
    swatchDot: document.getElementById("swatchDot"),
    colourPopover: document.getElementById("colourPopover"),
    swatchRow: document.getElementById("swatchRow"),
    hexInput: document.getElementById("hexInput"),
    content: document.getElementById("content"),
    paywallOverlay: document.getElementById("paywallOverlay"),
    paywallBuyBtn: document.getElementById("paywallBuyBtn"),
    paywallCancelBtn: document.getElementById("paywallCancelBtn"),
    licenseInput: document.getElementById("licenseInput"),
    verifyLicenseBtn: document.getElementById("verifyLicenseBtn"),
    paywallError: document.getElementById("paywallError"),
    toast: document.getElementById("toast"),
  };

  // ---------- Static chrome assets ----------
  els.searchImg.src = asset("assets/search.svg");
  els.chevronImg1.src = asset("icons/arrows/medium/chevron-down-small.svg");
  els.chevronImg2.src = asset("icons/arrows/medium/chevron-down-small.svg");

  // Logo is loaded as inline SVG (not <img src>) so the wordmark's
  // var(--fill-0, #424242) paths can be forced white for the dark header;
  // an <img> can't inherit CSS custom properties from the host document.
  fetch(asset("assets/logo.svg"))
    .then((res) => res.text())
    .then((svg) => {
      els.logoWrap.innerHTML = svg.replace(/var\(--fill-0,\s*#?[0-9a-fA-F]{3,6}\)/g, "#fafafa");
    })
    .catch(() => {});

  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.hidden = false;
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => { els.toast.hidden = true; }, 1800);
  }

  // ---------- Paywall (Gumroad license key) ----------
  // Browsing (category, weight, colour) is unrestricted for everyone; only
  // inserting a non-General icon onto the canvas is gated (see insertIcon
  // and the per-tile lock badge in render()).
  els.paywallBuyBtn.href = GUMROAD_CHECKOUT_URL;

  function openPaywall() {
    els.paywallError.hidden = true;
    els.paywallOverlay.hidden = false;
  }
  function closePaywall() {
    els.paywallOverlay.hidden = true;
  }
  els.paywallCancelBtn.addEventListener("click", closePaywall);
  els.paywallOverlay.addEventListener("click", (e) => {
    if (e.target === els.paywallOverlay) closePaywall();
  });

  function showPaywallError(message) {
    els.paywallError.textContent = message;
    els.paywallError.hidden = false;
  }

  els.verifyLicenseBtn.addEventListener("click", async () => {
    const key = els.licenseInput.value.trim();
    if (!key) {
      showPaywallError("Enter your license key first.");
      return;
    }
    els.verifyLicenseBtn.disabled = true;
    els.verifyLicenseBtn.textContent = "...";
    els.paywallError.hidden = true;
    try {
      const res = await fetch(LICENSE_API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ licenseKey: key }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.valid) {
        setUnlocked();
        closePaywall();
        showToast("Unlocked! Thanks for your purchase.");
        renderCategoryPopover();
        render();
      } else {
        showPaywallError(data.reason || "That license key doesn't look valid.");
      }
    } catch {
      showPaywallError("Couldn't verify right now. Check your connection and try again.");
    } finally {
      els.verifyLicenseBtn.disabled = false;
      els.verifyLicenseBtn.textContent = "Verify";
    }
  });

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "insert-icon-done") {
      showToast("Inserted");
    } else if (msg.type === "error") {
      showToast("Error: " + msg.message);
    }
  };

  // ---------- Load icon manifest (reuses the web app's js/data.js as the
  // single source of truth, so category/icon moves show up automatically) ----------
  async function loadIconData() {
    // This is the manifest that drives the whole panel (categories, icon
    // lists, weight schemes) -- it must never be served from a stale HTTP
    // cache. "no-store" forces a real network hit every time the plugin
    // opens, bypassing both this webview's own cache and any cached
    // Response that "cache: reload" would still accept if fresh-looking.
    const res = await fetch(asset("js/data.js"), { cache: "no-store" });
    const text = await res.text();
    const scope = {};
    new Function(
      "scope",
      text + "\nscope.CATEGORIES = CATEGORIES; scope.ICONS = ICONS; scope.WEIGHTS = WEIGHTS; scope.SOCIAL_WEIGHTS = SOCIAL_WEIGHTS; scope.weightSchemeFor = weightSchemeFor; scope.iconLabel = iconLabel; scope.getAllIcons = getAllIcons; scope.iconSvgPath = iconSvgPath; scope.categoryIconPath = categoryIconPath;"
    )(scope);
    // "All icons" is now a real, selectable category (drives global search
    // -- see the search input handler below), so it's kept rather than
    // filtered out.
    state.CATEGORIES = scope.CATEGORIES;
    state.ICONS = scope.ICONS;
    state.WEIGHTS = scope.WEIGHTS;
    state.SOCIAL_WEIGHTS = scope.SOCIAL_WEIGHTS;
    state.weightSchemeFor = scope.weightSchemeFor;
    state.iconLabel = scope.iconLabel;
    state.getAllIcons = scope.getAllIcons;
    state.iconSvgPath = scope.iconSvgPath;
    state.categoryIconPath = scope.categoryIconPath;
  }

  function currentWeight() {
    const scheme = state.weightSchemeFor(state.category);
    return scheme[state.weightIndex] || scheme[0];
  }

  // Each returned icon carries its real origin category (not just the
  // selected one) since "All icons" mixes icons from every category, and
  // both the paywall lock and the SVG file path depend on the icon's own
  // category, not whichever one is currently selected.
  function iconsForCategory(categorySlug) {
    const weight = currentWeight();
    if (categorySlug === ALL_CATEGORY) {
      return state
        .getAllIcons()
        .filter((ic) => ic.weights.includes(weight))
        .sort((a, b) => a.slug.localeCompare(b.slug))
        .map((ic) => ({ slug: ic.slug, category: ic.category }));
    }
    const byWeight = state.ICONS[categorySlug] || {};
    return (byWeight[weight] || []).map((slug) => ({ slug, category: categorySlug }));
  }

  // ---------- Category dropdown ----------
  // Browsing every category is free; only inserting a non-General icon is
  // gated (see insertIcon), so this is a plain switcher, no lock badges.
  function renderCategoryPopover() {
    els.categoryPopover.innerHTML = "";
    state.CATEGORIES.forEach((cat) => {
      const item = document.createElement("div");
      item.className = "category-item" + (cat.slug === state.category ? " active" : "");
      const iconWrap = document.createElement("span");
      iconWrap.className = "cat-icon";
      const iconPath = state.categoryIconPath(cat.slug);
      if (iconPath) {
        loadSvg(asset(iconPath)).then((svg) => { iconWrap.innerHTML = svg; }).catch(() => {});
      }
      const label = document.createElement("span");
      label.textContent = cat.name;
      item.append(iconWrap, label);
      item.addEventListener("click", () => {
        state.category = cat.slug;
        state.weightIndex = 0;
        els.categoryLabel.textContent = cat.name;
        els.categoryPopover.hidden = true;
        clearSearch();
        renderWeightSlider();
        updateColourAvailability();
        render();
      });
      els.categoryPopover.appendChild(item);
    });
  }
  els.categoryBtn.addEventListener("click", () => {
    els.categoryPopover.hidden = !els.categoryPopover.hidden;
    els.colourPopover.hidden = true;
  });

  // ---------- Weight slider ----------
  const WEIGHT_LABELS = {
    light: "Light", medium: "Medium", bold: "Bold", filled: "Filled",
    colour: "Colour", bw: "B&W",
  };

  // Browsing every weight is free; only inserting a non-General icon is
  // gated (see insertIcon).
  function setWeight(index) {
    state.weightIndex = index;
    updateWeightVisuals();
    render();
  }

  // Each stop is a button showing a real icon rendered in that weight, so
  // the difference between weights is genuinely visible. Social's Colour/
  // B&W scheme previews a brand icon instead, since it has no "home" icon
  // of its own.
  const WEIGHT_PREVIEW_ICON = { category: "general", slug: "home" };
  const SOCIAL_PREVIEW_ICON = { category: "social", slug: "facebook" };

  function renderWeightSlider() {
    const scheme = state.weightSchemeFor(state.category);
    const preview = state.category === "social" ? SOCIAL_PREVIEW_ICON : WEIGHT_PREVIEW_ICON;
    els.weightTrack.innerHTML = "";
    scheme.forEach((w, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "weight-option";
      btn.setAttribute("aria-label", WEIGHT_LABELS[w] || w);
      btn.addEventListener("click", () => setWeight(i));

      const iconWrap = document.createElement("span");
      iconWrap.className = "weight-option-icon";
      loadSvg(asset(state.iconSvgPath(preview.category, w, preview.slug)))
        .then((svg) => { iconWrap.innerHTML = svg; })
        .catch(() => {});

      btn.appendChild(iconWrap);
      els.weightTrack.appendChild(btn);
    });
    updateWeightVisuals();
  }

  function updateWeightVisuals() {
    els.weightTrack.querySelectorAll(".weight-option").forEach((btn, i) => {
      btn.classList.toggle("active", i === state.weightIndex);
    });
  }

  // Social icons are fixed brand colours, so the whole colour control is
  // disabled while that category is active.
  function updateColourAvailability() {
    const disabled = state.category === "social";
    els.colourSection.classList.toggle("disabled", disabled);
    if (disabled) els.colourPopover.hidden = true;
  }

  // ---------- Format toggle (free) ----------
  els.formatToggle.querySelectorAll(".format-opt").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.format = btn.dataset.format;
      els.formatToggle.querySelectorAll(".format-opt").forEach((b) => b.classList.toggle("active", b === btn));
    });
  });

  // ---------- Colour swatch / popover ----------
  function renderSwatchRow() {
    els.swatchRow.innerHTML = "";
    PRESET_SWATCHES.forEach((hex) => {
      const sw = document.createElement("button");
      sw.type = "button";
      sw.className = "swatch" + (hex.toUpperCase() === state.colour.toUpperCase() ? " active" : "");
      sw.style.background = hex;
      sw.addEventListener("click", () => setColour(hex));
      els.swatchRow.appendChild(sw);
    });
  }
  function setColour(hex) {
    state.colour = hex.toUpperCase();
    els.swatchDot.style.background = state.colour;
    els.hexInput.value = state.colour;
    renderSwatchRow();
    render();
  }
  // Colour selection is free for everyone; only inserting a non-General
  // icon is gated (see insertIcon).
  els.colourBtn.addEventListener("click", () => {
    els.colourPopover.hidden = !els.colourPopover.hidden;
    els.categoryPopover.hidden = true;
    renderSwatchRow();
  });
  els.hexInput.addEventListener("change", () => {
    const val = els.hexInput.value.trim();
    const normalized = val.startsWith("#") ? val : "#" + val;
    if (/^#([0-9a-fA-F]{6})$/.test(normalized)) {
      setColour(normalized);
    } else {
      els.hexInput.value = state.colour;
    }
  });

  document.addEventListener("click", (e) => {
    if (!els.categoryBtn.parentElement.contains(e.target)) els.categoryPopover.hidden = true;
    if (!els.colourBtn.parentElement.contains(e.target)) els.colourPopover.hidden = true;
  });

  // ---------- Search ----------
  function clearSearch() {
    state.search = "";
    els.searchInput.value = "";
  }
  // Search is global: it looks across every category regardless of which
  // one is selected, so as soon as there's a query the selected category
  // switches to "All icons" to make that visible (and so per-icon lock
  // badges reflect each result's own category, see iconsForCategory).
  els.searchInput.addEventListener("input", () => {
    state.search = els.searchInput.value;
    if (state.search.trim() && state.category !== ALL_CATEGORY) {
      state.category = ALL_CATEGORY;
      state.weightIndex = 0;
      const allCat = state.CATEGORIES.find((c) => c.slug === ALL_CATEGORY);
      els.categoryLabel.textContent = allCat ? allCat.name : "All icons";
      renderCategoryPopover();
      renderWeightSlider();
      updateColourAvailability();
    }
    render();
  });

  // ---------- Icon grid ----------
  async function loadSvg(url) {
    if (svgCache.has(url)) return svgCache.get(url);
    const res = await fetch(url);
    if (!res.ok) throw new Error("Failed to load " + url);
    const text = await res.text();
    svgCache.set(url, text);
    return text;
  }

  function resolvedSvgMarkup(rawSvg) {
    return rawSvg.replace(/var\(--(?:fill|stroke)-0,\s*#?[0-9a-fA-F]{3,6}\)/g, state.colour);
  }

  function svgToPngBytes(svgText, size) {
    return new Promise((resolve, reject) => {
      const blob = new Blob([svgText], { type: "image/svg+xml" });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, size, size);
        canvas.toBlob((pngBlob) => {
          pngBlob.arrayBuffer().then((buf) => {
            URL.revokeObjectURL(url);
            resolve(new Uint8Array(buf));
          });
        }, "image/png");
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  async function insertIcon(icon) {
    // icon.category is the icon's own origin category, not necessarily
    // state.category -- in the "All icons" view they can differ.
    const locked = icon.category !== FREE_CATEGORY && !isUnlocked();
    if (locked) {
      openPaywall();
      return;
    }
    const path = state.iconSvgPath(icon.category, currentWeight(), icon.slug);
    const raw = await loadSvg(asset(path));
    const resolved = resolvedSvgMarkup(raw);
    if (state.format === "svg") {
      parent.postMessage({ pluginMessage: { type: "insert-icon", svg: resolved, size: 24 } }, "*");
    } else {
      const bytes = await svgToPngBytes(resolved, 256);
      parent.postMessage({ pluginMessage: { type: "insert-icon-png", bytes: Array.from(bytes), size: 24 } }, "*");
    }
  }

  async function render() {
    const cat = state.CATEGORIES.find((c) => c.slug === state.category);
    let icons = iconsForCategory(state.category);
    const q = state.search.trim().toLowerCase();
    if (q) {
      icons = icons.filter((ic) => state.iconLabel(ic.slug).includes(q));
    }

    els.content.innerHTML = "";
    const label = document.createElement("p");
    label.className = "section-label";
    label.textContent = cat ? cat.name : "";
    els.content.appendChild(label);

    if (icons.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = q ? 'No results found for "' + state.search.trim() + '"' : "No icons here yet";
      els.content.appendChild(empty);
      return;
    }

    const grid = document.createElement("div");
    grid.className = "icon-grid";
    els.content.appendChild(grid);

    for (const icon of icons) {
      // Locked per icon, not per view: in "All icons" every icon keeps
      // whatever lock status its own category would give it on its own.
      const locked = icon.category !== FREE_CATEGORY && !isUnlocked();

      const tile = document.createElement("button");
      tile.type = "button";
      tile.className = "icon-tile";
      tile.title = icon.slug;
      tile.addEventListener("click", () => insertIcon(icon));
      grid.appendChild(tile);

      if (locked) {
        const badge = document.createElement("span");
        badge.className = "lock-badge";
        const img = document.createElement("img");
        img.src = asset("icons/security/light/lock.svg");
        badge.appendChild(img);
        tile.appendChild(badge);
      }

      const path = state.iconSvgPath(icon.category, currentWeight(), icon.slug);
      loadSvg(asset(path))
        .then((raw) => {
          tile.insertAdjacentHTML("afterbegin", resolvedSvgMarkup(raw));
        })
        .catch(() => {});
    }
  }

  // ---------- Init ----------
  async function init() {
    try {
      await loadIconData();
    } catch (err) {
      // Surface the real error (network vs. parse vs. eval failure) instead
      // of a generic message, so this is diagnosable from a screenshot.
      const detail = (err && (err.stack || err.message)) || String(err);
      console.error("Forma: failed to load icon data", err);
      els.content.innerHTML =
        '<div class="empty-state">Could not load icon data from ' + BASE_URL +
        '<br><br>' + String(detail).replace(/</g, "&lt;") + '</div>';
      return;
    }
    renderWeightSlider();
    updateColourAvailability();
    renderSwatchRow();
    renderCategoryPopover();
    els.hexInput.value = state.colour;
    await render();
  }

  init();
})();
</script>
</body>
</html>
